version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: testcolony-postgres
    environment:
      POSTGRES_USER: testcolony
      POSTGRES_PASSWORD: testcolony
      POSTGRES_DB: testcolony
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testcolony"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache & Message Queue
  redis:
    image: redis:7-alpine
    container_name: testcolony-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # NestJS Backend
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    container_name: testcolony-server
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://testcolony:testcolony@postgres:5432/testcolony
      REDIS_URL: redis://redis:6379
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      JWT_SECRET: dev-jwt-secret-change-in-production
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../apps/server/src:/app/apps/server/src
      - ../packages:/app/packages
      - ./uploads:/app/uploads

  # Next.js Frontend
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: testcolony-web
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - server
    volumes:
      - ../apps/web/src:/app/apps/web/src
      - ../packages:/app/packages

  # Nginx Reverse Proxy (for production)
  nginx:
    image: nginx:alpine
    container_name: testcolony-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server
      - web
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:
  uploads:
